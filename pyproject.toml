[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clicky-linux"
version = "0.5.0"
description = "The open-source AI desktop buddy for Linux (Wayland & X11) that literally points where to click."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Clicky Linux Community" }
]
keywords = ["linux", "wayland", "ai", "assistant", "desktop-copilot", "vision", "overlay", "pyqt6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "Pillow>=10.0.0",
    "PyQt6>=6.5.0",
]

[project.scripts]
clicky = "clicky_linux.main:main"
clicky-pointer = "clicky_linux.test_pointer:main"
clicky-budget = "clicky_linux.core.budget_guard:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clicky_linux*"]
